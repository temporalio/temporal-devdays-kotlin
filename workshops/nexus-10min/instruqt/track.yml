title: Decouple a Monolith with Temporal Nexus in 10 Minutes (Kotlin)
teaser: Move a compliance check out of the payments process and behind a Nexus boundary,
  then take it down and watch payments wait instead of fail.
description: |-
  Payments and Compliance share one Worker, one Namespace, one blast radius. A bug
  in compliance code at 3 AM takes payments down with it.

  The Compliance team already runs its own Worker in its own Namespace behind a
  Nexus Endpoint. You swap the call: an Activity stub becomes a Nexus stub, one word
  changes at the call site, and one line on the Payments Worker goes away.

  Then break it on purpose. Stop the Compliance Worker, send payments anyway, and
  watch them wait instead of fail.

  Kotlin on the Temporal Java SDK. Two challenges, about ten minutes.
